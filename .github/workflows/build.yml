name: Build iOS IPA cho TrollStore

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Bien dich va Dong goi
        run: |
          # 1. Tạo cấu trúc thư mục Payload bắt buộc cho TrollStore
          mkdir -p Payload/AppBatchDeleter.app
          
          # 2. Biên dịch SwiftUI thành tệp chạy trên iPhone thật (arm64)
          swiftc AppBatchDeleterApp.swift -target arm64-apple-ios15.0 -sdk $(xcrun --show-sdk-path -sdk iphoneos) -parse-as-library -o Payload/AppBatchDeleter.app/AppBatchDeleter

          # 3. Tạo file cấu hình Info.plist
          cat << 'EOF' > Payload/AppBatchDeleter.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.hoangnamkhang.AppBatchDeleter</string>
              <key>CFBundleName</key>
              <string>AppBatchDeleter</string>
              <key>CFBundleDisplayName</key>
              <string>AppBatchDeleter</string>
              <key>CFBundleExecutable</key>
              <string>AppBatchDeleter</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
              <key>UILaunchScreen</key>
              <dict/>
          </dict>
          </plist>
          EOF

          # 4. Nén nguyên thư mục Payload thành file .ipa
          zip -r AppBatchDeleter.ipa Payload

      - name: Tai file IPA len Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AppBatchDeleter-IPA
          path: AppBatchDeleter.ipa
