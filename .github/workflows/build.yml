name: Build iOS IPA

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build Executable for iOS Simulator
        run: |
          swift build -c release --triple arm64-apple-ios-simulator

      - name: Package into .app and .ipa structure
        run: |
          mkdir -p Payload/AppBatchDeleter.app
          cp .build/arm64-apple-ios-simulator/release/AppBatchDeleter Payload/AppBatchDeleter.app/AppBatchDeleter
          
          # Tạo file Info.plist tối thiểu cho ứng dụng iOS
          cat << 'EOF' > Payload/AppBatchDeleter.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.hoangnamkhang.AppBatchDeleter</string>
              <key>CFBundleName</key>
              <string>AppBatchDeleter</string>
              <key>CFBundleDisplayName</key>
              <string>AppBatchDeleter</string>
              <key>CFBundleExecutable</key>
              <string>AppBatchDeleter</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
              <key>UILaunchScreen</key>
              <dict/>
          </dict>
          </dict>
          </plist>
          EOF

          cd Payload
          zip -r ../AppBatchDeleter.ipa AppBatchDeleter.app
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppBatchDeleter-IPA
          path: AppBatchDeleter.ipa
