name: Build iOS IPA

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build App for iOS Simulator via xcodebuild
        run: |
          # Biên dịch trực tiếp target cho iOS Simulator
          xcodebuild -theProjectName AppBatchDeleter -scmProvider system || true
          
          # Tạo cấu trúc thư mục Payload chuẩn của file IPA
          mkdir -p Payload/AppBatchDeleter.app
          
          # Biên dịch mã nguồn Swift trực tiếp thành tệp thi hành arm64
          swiftc AppBatchDeleterApp.swift -target arm64-apple-ios14.0-simulator -sdk $(xcrun --sdk iphonesimulator --show-sdk-path) -o Payload/AppBatchDeleter.app/AppBatchDeleter ||           swiftc AppBatchDeleterApp.swift -sdk $(xcrun --sdk iphonesimulator --show-sdk-path) -o Payload/AppBatchDeleter.app/AppBatchDeleter

          # Tạo file Info.plist cấu hình ứng dụng
          cat << 'EOF' > Payload/AppBatchDeleter.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.hoangnamkhang.AppBatchDeleter</string>
              <key>CFBundleName</key>
              <string>AppBatchDeleter</string>
              <key>CFBundleDisplayName</key>
              <string>AppBatchDeleter</string>
              <key>CFBundleExecutable</key>
              <string>AppBatchDeleter</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
          </dict>
          </plist>
          EOF

          # Đóng gói thành file IPA
          cd Payload
          zip -r ../AppBatchDeleter.ipa AppBatchDeleter.app
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppBatchDeleter-IPA
          path: AppBatchDeleter.ipa
