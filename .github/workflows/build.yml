name: Build iOS IPA cho TrollStore

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ldid
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
        run: |
          brew install ldid || {
            sudo curl -sSL -o /usr/local/bin/ldid https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_macos_x86_64
            sudo chmod +x /usr/local/bin/ldid
          }

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Bien dich va Ky Entitlements
        run: |
          set -e
          mkdir -p Payload/AppBatchDeleter.app

          # 1. Biên dịch Swift
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          swiftc AppBatchDeleterApp.swift \
            -parse-as-library \
            -target arm64-apple-ios15.0 \
            -sdk "$SDK_PATH" \
            -o Payload/AppBatchDeleter.app/AppBatchDeleter
          
          chmod +x Payload/AppBatchDeleter.app/AppBatchDeleter

          # 2. Ký Entitlements root & MobileInstallation
          ldid -SEntitlements.plist Payload/AppBatchDeleter.app/AppBatchDeleter

          # 3. Ghi Info.plist cơ bản
          cat << 'EOF' > Payload/AppBatchDeleter.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.plist">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.hoangnamkhang.AppBatchDeleter</string>
              <key>CFBundleName</key>
              <string>AppBatchDeleter</string>
              <key>CFBundleDisplayName</key>
              <string>Filza Deleter</string>
              <key>CFBundleExecutable</key>
              <string>AppBatchDeleter</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
              <key>LSApplicationQueriesSchemes</key>
              <array>
                  <string>filza</string>
              </array>
              <key>UIBackgroundModes</key>
              <array>
                  <string>fetch</string>
                  <string>processing</string>
              </array>
              <key>UILaunchScreen</key>
              <dict/>
          </dict>
          </plist>
          EOF

          zip -r AppBatchDeleter.ipa Payload

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.run_number }}
          name: AppBatchDeleter Build #${{ github.run_number }}
          files: AppBatchDeleter.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
